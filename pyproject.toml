[project]
name = "inference"
version = "0.1.0"
description = "STT -> RAG Index -> MCQ Quiz Generation Pipeline"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.128.6",
    "pydantic>=2.0",
    "httpx>=0.27.0",
    "uvicorn>=0.32.1",
    "python-dotenv>=1.0.0",
    "chromadb>=0.4.0",
    "faster-whisper>=1.0.0",
    "openai>=1.0.0",
    "tiktoken>=0.5.0",
    "wtpsplit>=2.0.0",
    "sentence-transformers>=2.0.0",
    "torch>=2.2.0,<2.3.0",
    "onnxruntime>=1.24.1",
    "numpy>=1.26,<2",
]

[tool.uv.sources]
torch = { index = "pytorch-cu121" }

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true
